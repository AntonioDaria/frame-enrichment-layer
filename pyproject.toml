[project]
name = "assaia-frame-enrichment"
version = "0.1.0"
description = "Enrichment layer that tags each camera frame with its room's latest light colour."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
# The package is not installed into the venv, so put the repo root on sys.path
# to make `import app` work from the tests.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
